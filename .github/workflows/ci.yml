name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type check, unit tests, end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose.yml. "PostgreSQL only" (FEATURES §0)
        # means the database layer has nothing else worth testing against.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dagda
          POSTGRES_PASSWORD: dagda
          POSTGRES_DB: dagda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dagda -d dagda"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # Without this, an unreachable database would silently turn into
      # "all database tests skipped" and the build would still be green.
      DAGDA_REQUIRE_DB: "1"
      DAGDA_TEST_DB_URL: postgresql://dagda:dagda@localhost:5432/dagda

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
